$schema: "https://moonrepo.dev/schemas/tasks.json"

# Moon Task Configuration - Moon v2 format
# All commands use cargo with Rust toolchain
# Tasks are inherited by all projects in the workspace

tasks:
  # ============================================================================
  # STAGE 1: CODE FORMATTING & LINTING
  # ============================================================================

  fmt:
    command: "cargo fmt --all --check"
    description: "Check code formatting (rustfmt)"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "rustfmt.toml"
    options:
      runInCI: true
      cache: true

  fmt-fix:
    command: "cargo fmt --all"
    description: "Auto-fix code formatting"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
    options:
      cache: false  # Never cache - always format

  clippy:
    command: "cargo clippy --workspace --all-features --lib --bins --examples -- -D warnings -W clippy::all -D clippy::too_many_lines -D clippy::too_many_arguments"
    description: "Strict source linting with Clippy (tests excluded) - ZERO TOLERANCE"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
      - ".clippy.toml"
    options:
      runInCI: true
      cache: true

  max-lines:
    command: "bash scripts/max-lines.sh 300"
    description: "List files exceeding 300 lines"

  security:
    command: "cargo audit"
    description: "Audit dependencies for known vulnerabilities"
    toolchains:
      - rust
    inputs:
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: false

  # ============================================================================
  # STAGE 2: TESTING
  # ============================================================================

  test:
    command: "cargo test --workspace --all-features"
    description: "Run all tests"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: true
      mergeArgs: "replace"  # Allow overriding with specific test filters
    env:
      CARGO_BUILD_JOBS: "16"

  test-doc:
    command: "cargo test --doc --workspace"
    description: "Run documentation tests"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: true

  holdout:
    command: "cargo test --workspace --all-features -- --ignored holdout"
    description: "Run hidden holdout scenario suite"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: true

  coverage:
    command: "cargo tarpaulin --workspace --all-features --out Html --out Lcov --output-dir target/coverage -- --test-threads=1"
    description: "Generate test coverage report (HTML + LCOV)"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "/target/coverage/index.html"
      - "/target/coverage/lcov.info"
    options:
      cache: false
    env:
      CARGO_BUILD_JOBS: "8"

  # ============================================================================
  # STAGE 3: BUILD
  # ============================================================================

  build:
    command: "cargo build --release --workspace"
    description: "Build release binaries"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "/target/release/oya"
    options:
      runInCI: true
      cache: true
    env:
      CARGO_BUILD_JOBS: "24"

  build-docs:
    command: "cargo doc --no-deps --document-private-items"
    description: "Generate Rust documentation"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: true

  # ============================================================================
  # COMPOSITE PIPELINES
  # ============================================================================

  quick:
    command: "true"
    description: "Fast lint check (format + clippy in parallel)"
    deps:
      - "~:fmt"      # ~ prefix runs in parallel
      - "~:clippy"
    options:
      cache: false  # Composite task - deps handle caching

  ci:
    command: "true"
    description: "Full CI pipeline (fmt + clippy + tests + holdout + build + cue)"
    deps:
      - "~:fmt"
      - "~:clippy"
      - "test"
      - "holdout"
      - "build"
      - "cue-check"
    options:
      runInCI: true
      cache: false

  # ============================================================================
  # CONVENIENCE (workspace-level tasks only)
  # ============================================================================

  install:
    script: "mkdir -p ~/.local/bin && cargo build --release --bin oya && cp target/release/oya ~/.local/bin/oya && chmod +x ~/.local/bin/oya && echo '✅ Installed oya to ~/.local/bin/oya (v0.1.2)'"
    description: "Install oya binary to ~/.local/bin (system-wide)"
    toolchains:
      - rust
    options:
      cache: false
      runFromWorkspaceRoot: true

  dev:
    command: "true"
    description: "Quick development workflow: build + install"
    deps:
      - "build"
      - "install"
    options:
      cache: false

  clean:
    command: "cargo clean"
    description: "Clean build artifacts"
    toolchains:
      - rust
    options:
      cache: false

  check:
    command: "cargo check --workspace --all-features"
    description: "Fast type check without building"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      runInCI: true
      cache: true

  bench:
     command: "cargo bench --workspace"
     description: "Run all Criterion benchmarks"
     toolchains:
       - rust
     inputs:
       - "src/**/*.rs"
       - "Cargo.toml"
       - "/Cargo.lock"
     options:
       cache: false

  # ============================================================================
  # DEVELOPMENT SERVERS
  # ============================================================================

  # ============================================================================
  # MUTATION TESTING
  # ============================================================================

  mutants:
    command: "cargo mutants --baseline run"
    description: "Run mutation testing on all mutations"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - ".cargo/mutants.toml"
    options:
      cache: false
      runInCI: false

  mutants-list:
    command: "cargo mutants --workspace --list"
    description: "List all 2000+ possible mutations"
    toolchains:
      - rust
    options:
      cache: false

  mutants-package:
    command: "cargo mutants --baseline run"
    description: "Run mutation testing on specific package (use -p PKG)"
    toolchains:
      - rust
    options:
      cache: false
      runInCI: false
      mergeArgs: "append"

  mutants-diff:
    command: "cargo mutants --in-diff main --baseline run"
    description: "Mutation test only files changed vs main branch"
    toolchains:
      - rust
    options:
      cache: false
      runInCI: false

  mutants-uncaught:
    command: "cargo mutants --workspace --baseline run --caught"
    description: "Show only UNCAUGHT mutations (test gaps)"
    toolchains:
      - rust
    options:
      cache: false
      runInCI: false

  # ============================================================================
  # OYA CLI (workspace-level tasks)
  # ============================================================================

  oya:
    command: "oya"
    description: "Run installed oya CLI (requires 'moon run install' first)"
    options:
      runFromWorkspaceRoot: true

  oya-install-and-run:
    command: "true"
    description: "Ensure oya is installed and run it"
    deps:
      - "install"
    options:
      runFromWorkspaceRoot: true
      cache: false

  # ============================================================================
  # RELEASE TARGETS (Single oya binary + WASM plugin)
  # ============================================================================

  release:
    command: "true"
    description: "Build all release targets (oya binary + WASM plugin)"
    deps:
      - "~:build-oya"
    options:
      cache: false

  build-oya:
    command: "cargo build --release --bin oya"
    description: "Build oya binary (contains everything)"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "/target/release/oya"
    options:
      cache: true
      runFromWorkspaceRoot: true
    env:
      CARGO_BUILD_JOBS: "24"

  install-all:
    command: "true"
    description: "Install everything (oya binary + WASM plugin)"
    deps:
      - "~:install"
    options:
      cache: false

  # Run oya directly from moon (without installing)
  run:
    script: "cargo run --release --bin oya --"
    description: "Run oya directly (via moon)"
    toolchains:
      - rust
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mergeArgs: "append"

  # ============================================================================
  # CUE VALIDATION
  # ============================================================================

  cue-check:
    command: "scripts/cue-check.sh"
    description: "Validate CUE implementation proofs against schemas"
    inputs:
      - ".beads/schemas/*.cue"
      - ".beads/implementation/*.cue"
    options:
      runInCI: true
      cache: true
      runFromWorkspaceRoot: true

  # Convenience: start IPC server
  run-serve:
    script: "cargo run --release --bin oya -- serve"
    description: "Start OYA IPC server"
    toolchains:
      - rust
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
