$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  oya:
    command: "oya"
    description: "Run installed oya CLI (requires 'moon run install' first)"
    options:
      runFromWorkspaceRoot: true

  oya-install-and-run:
    command: "true"
    description: "Ensure oya is installed and run it"
    deps:
      - "install"
    options:
      runFromWorkspaceRoot: true
      cache: false

  run:
    command: "./target/release/oya"
    description: "Run the built oya CLI through Moon"
    deps:
      - "build-oya"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mergeArgs: "append"

  run-serve:
    command: "./target/release/oya serve"
    description: "Start OYA IPC server"
    deps:
      - "build-oya"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mergeArgs: "append"

  mutants-quick:
    script: "mkdir -p target && git diff --unified=0 main...HEAD > target/mutants-quick.diff && cargo mutants --in-diff target/mutants-quick.diff --baseline run"
    description: "Opt-in mutation gate for changed Rust code only"
    toolchains:
      - rust
    inputs:
      - "src/**/*.rs"
      - ".cargo/mutants.toml"
      - "/Cargo.lock"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mergeArgs: "append"
