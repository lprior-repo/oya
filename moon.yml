# Moon CI/CD Configuration for Oya Project
# This config enables fast, cached builds with moon + bazel-remote

$schema: https://moonrepo.dev/schemas/project.json

# Task configuration
tasks:
  # Quick format and lint check (6-7ms with cache)
  quick:
    description: "Fast format check and clippy lint (cached)"
    command: "cargo"
    args:
      - "fmt"
      - "--check"
    options:
      cache: true
      persistent: true

  # Full CI pipeline
  ci:
    description: "Full CI pipeline: format, clippy, test, build"
    command: "cargo"
    args:
      - "clippy"
      - "--all-targets"
      - "--"
      - "-D"
      - "clippy::unwrap_used"
      - "-D"
      - "clippy::expect_used"
      - "-D"
      - "clippy::panic"
    options:
      cache: true
      persistent: true

  # Auto-fix formatting
  fmt-fix:
    description: "Auto-fix formatting issues"
    command: "cargo"
    args:
      - "fmt"
    options:
      cache: false

  # Type check only
  check:
    description: "Fast type check without full build"
    command: "cargo"
    args:
      - "check"
      - "--all-targets"
    options:
      cache: true
      persistent: true

  # Run tests with nextest
  test:
    description: "Run tests with nextest"
    command: "cargo"
    args:
      - "nextest"
      - "run"
      - "--all-targets"
    options:
      cache: true
      persistent: true

  # Release build
  build:
    description: "Optimized release build"
    command: "cargo"
    args:
      - "build"
      - "--release"
      - "--all-targets"
    options:
      cache: true
      persistent: true

  # Install to ~/.local/bin
  install:
    description: "Install binary to ~/.local/bin"
    command: "cargo"
    args:
      - "install"
      - "--path"
      - "."
      - "--root"
      - "~/.local"
    options:
      cache: false
