# Oya configuration consumed by `oya run`.
#
# Fields:
#   model: Optional OpenCode model reference. CLI `--model` overrides this value,
#   and the built-in default is used only when neither CLI nor config supply a model.
#   model_tiers: Data-driven model tier configuration. Each tier maps to a list of models
#   for failover and tier-based selection.
model: zai-coding-plan/glm-5
model_tiers:
  d:
    - zai-coding-plan/glm-4.6
  c:
    - opencode/glm-5-free
    - google/gemini-3-pro-preview
    - google/gemini-3-flash-preview
    - local/qwen3-coder-next
  b:
    - zai-coding-plan/glm-4.7-flashx
    - zai-coding-plan/glm-5
    - openai/gpt-5.1-codex-mini
    - openai/gpt-5.3-codex-spark
    - google/gemini-3.1-pro-preview
    - anthropic/claude-sonnet-4-6
  a:
    - openai/gpt-5.3-codex
    - anthropic/claude-opus-4-6
    - github-copilot/gpt-5.2-codex
    - github-copilot/claude-opus-4-6
  s:
    - openai/gpt-5.3-codex
    - anthropic/claude-opus-4-6
    - github-copilot/gpt-5.2-codex
    - github-copilot/claude-opus-4-6
