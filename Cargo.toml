[package]
name = "oya"
version = "0.1.0"
edition = "2021"

[features]
restate = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
im = "15.1"
itertools = "0.14"
reqwest = { version = "0.12", features = ["json"] }
restate-sdk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
strum = { version = "0.27", features = ["derive"] }
tap = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
restate-sdk-testcontainers = "0.8"
wiremock = "0.6"
proptest = "1.5"
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.12"
pretty_assertions = "1.4"
async-trait = "0.1"
tokio-test = "0.4"
