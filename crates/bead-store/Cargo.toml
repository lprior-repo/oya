[package]
name = "bead-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Lewis Prior <lewis@lewisandquark.com>"]
license = "MIT"
repository = "https://github.com/lprior-repo/oya"
description = "Persistent storage for bead tracking with functional core and async shell"

[dependencies]
# Core 6 libraries
im = "15.1"              # Persistent data structures for Arc sharing
thiserror = "2.0"        # Domain errors in core
anyhow = "1.0"           # Boundary errors in shell

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime and I/O
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

[dev-dependencies]
proptest = "1.0"
tempfile = "3.0"
