[package]
name = "zellij-frontend"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Zellij WASM plugin and UI components for OYA SDLC visualization"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# Functional data structures
rpds = { workspace = true }
itertools = { workspace = true }

# IPC (needed for WASM plugin communication)
oya-ipc = { workspace = true }

# UUID generation (needed for integration tests)
uuid = { version = "1.11", features = ["v4", "serde"] }

# HTTP client and tokio (needed for native builds)
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true }

# Zellij tile API (Rust 1.83 + wasm32-wasi compatible)
# Note: zellij-tile is used for WASM plugin compatibility
# It's a dev dependency because the library re-exports ZellijPlugin trait
zellij-tile = { version = "0.41.1", optional = true }

[dev-dependencies]
# Testing
os_pipe = "1.2"

# Test utilities
tempfile = "3.13"

[profile.release]
opt-level = "z"             # Optimize for size
lto = true
codegen-units = 1
strip = true

[features]
default = []
wasm = []
